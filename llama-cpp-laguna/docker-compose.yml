services:
  # Builds poolsideai/llama.cpp from source (laguna branch) with DFlash
  # speculative decoding support. There is no runnable upstream image for this
  # fork on ghcr.io, so it must be compiled locally.
  # See laguna-llama-cpp.cuda.Dockerfile for the build-arg deltas vs. the fork's
  # own .devops/cuda.Dockerfile (CUDA arch pinned to sm_89, server target only).
  laguna-llama-cpp:
    container_name: laguna-llama-cpp
    build:
      context: ./laguna-llama-cpp
      dockerfile: ../laguna-llama-cpp.cuda.Dockerfile
      target: server
      args:
        LAGUNA_CUDA_VERSION: ${LAGUNA_CUDA_VERSION:-12.8}
        LAGUNA_CUDA_DOCKER_ARCH: ${LAGUNA_CUDA_DOCKER_ARCH:-89}
    network_mode: host
    restart: unless-stopped
    volumes:
      - ../models:/models
      - ./router.ini:/app/router.ini
    deploy:
      resources:
        reservations:
          devices:
            - driver: nvidia
              device_ids: ['0']
              capabilities: [gpu]
    environment:
      - LLAMA_API_KEY=${LLAMA_API_KEY}
      # Force container to only see GPU 0 (RTX 3090). Even with Xorg/Mutter/KMS
      # isolation on the host, this prevents the container from accidentally using
      # the T600 (GPU 1) for compute if something leaks through.
      - CUDA_VISIBLE_DEVICES=0
    command: >
      --host 0.0.0.0
      --port 10004
      --models-preset /app/router.ini
      --models-max 1
      --no-warmup
      --flash-attn on
      --context-shift
      --ctx-checkpoints 16
      --swa-checkpoints 16
      --cache-ram 16384
      --cache-reuse 4096
      --parallel 2