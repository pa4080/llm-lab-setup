[*]
batch-size = 4096 ; b = 2048
ubatch-size = 1024 ; ub = 512
flash-attn = on
; No global cache-type-k/-v here (unlike llama-cpp/router/0-Defaults.ini): all
; buun presets set `cache-type = vbr` themselves. -ctk/-ctv are separate CLI
; args from -ct, so a global q4_0 default would still land in argv *after*
; the preset's -ct vbr and win (last-arg-wins), silently defeating VBR.
fit = on                          ; auto-fit to VRAM (default)
fit-target = 1024                 ; 1024 MiB headroom per GPU (default)
fit-ctx = 4096                    ; min ctx-size when fitting (default)
temp = 0.8                        ; temperature (default)
top-k = 40                        ; top-k sampling (default)
top-p = 0.95                      ; top-p nucleus (default)
min-p = 0.05                      ; min-p filtering (default)
repeat-penalty = 1.0              ; neutral (default, no penalty)
presence-penalty = 0.0            ; no presence penalty (default)
frequency-penalty = 0.0           ; no frequency penalty (default)
; No global n-gpu-layers here (unlike llama-cpp/router/0-Defaults.ini): fit's
; common_params_fit_impl() throws/aborts whenever n_gpu_layers != the model's
; default sentinel (-1, "auto"), so pinning it to 99 silently disabled fit
; entirely (confirmed via common/fit.cpp:677). Leaving it unset lets fit pick
; the GPU layer count itself (still ends up fully offloaded on the RTX 3090
; for these models) while actually being able to auto-size ctx/VBR budget.
image-min-tokens = 1024					  ; min tokens for image input
; mlock = true										; default
; jinja = true										; default
; host = 0.0.0.0
; seed = 42

; --- 256K Context & YaRN RoPE Scaling for model trained on 32K ---
; ctx-size = 262144
; rope-scaling = yarn
; rope-scale = 8
; yarn-orig-ctx = 32768
; -----------------------------------------------------------------

