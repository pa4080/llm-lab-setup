services:
  # Builds spiritbuun/buun-llama-cpp from source (VBR, TurboQuant/TCQ KV cache,
  # --mmproj-gpu-swap). There is no runnable upstream image for this fork on
  # ghcr.io (only Docker buildcache layers), so it must be compiled locally.
  # See buun-llama-cpp.cuda.Dockerfile for the build-arg deltas vs. the fork's
  # own .devops/cuda.Dockerfile (GGML_CUDA_FA_ALL_QUANTS=ON, arch pinned to sm_86).
  buun-llama-cpp:
    container_name: buun-llama-cpp
    build:
      context: ./buun-llama-cpp
      dockerfile: ../buun-llama-cpp.cuda.Dockerfile
      target: server
      args:
        CUDA_VERSION: ${CUDA_VERSION:-13.0.1}
        CUDA_DOCKER_ARCH: ${CUDA_DOCKER_ARCH:-86}
    network_mode: host
    restart: unless-stopped
    volumes:
      - ../huggingface:/models
      - ./router.ini:/app/router.ini
    deploy:
      resources:
        reservations:
          devices:
            - driver: nvidia
              device_ids: ['0']
              capabilities: [gpu]
    environment:
      - LLAMA_API_KEY=${LLAMA_API_KEY}
    command: >
      --host 0.0.0.0
      --port 10005
      --models-preset /app/router.ini
      --models-max 1
      --no-warmup
      --flash-attn on
      --context-shift
      --ctx-checkpoints 8
      --swa-checkpoints 8
      --cache-ram 16384
      --cache-reuse 4096
      --parallel 3
