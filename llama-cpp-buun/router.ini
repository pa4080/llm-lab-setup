[*]
batch-size = 4096 ; b = 2048
ubatch-size = 1024 ; ub = 512
flash-attn = on
; No global cache-type-k/-v here (unlike llama-cpp/router/0-Defaults.ini): all
; buun presets set `cache-type = vbr` themselves. -ctk/-ctv are separate CLI
; args from -ct, so a global q4_0 default would still land in argv *after*
; the preset's -ct vbr and win (last-arg-wins), silently defeating VBR.
fit = on                          ; auto-fit to VRAM (default)
fit-target = 1024                 ; 1024 MiB headroom per GPU (default)
fit-ctx = 4096                    ; min ctx-size when fitting (default)
temp = 0.8                        ; temperature (default)
top-k = 40                        ; top-k sampling (default)
top-p = 0.95                      ; top-p nucleus (default)
min-p = 0.05                      ; min-p filtering (default)
repeat-penalty = 1.0              ; neutral (default, no penalty)
presence-penalty = 0.0            ; no presence penalty (default)
frequency-penalty = 0.0           ; no frequency penalty (default)
; No global n-gpu-layers here (unlike llama-cpp/router/0-Defaults.ini): fit's
; common_params_fit_impl() throws/aborts whenever n_gpu_layers != the model's
; default sentinel (-1, "auto"), so pinning it to 99 silently disabled fit
; entirely (confirmed via common/fit.cpp:677). Leaving it unset lets fit pick
; the GPU layer count itself (still ends up fully offloaded on the RTX 3090
; for these models) while actually being able to auto-size ctx/VBR budget.
image-min-tokens = 1024					  ; min tokens for image input
; mlock = true										; default
; jinja = true										; default
; host = 0.0.0.0
; seed = 42

; --- 256K Context & YaRN RoPE Scaling for model trained on 32K ---
; ctx-size = 262144
; rope-scaling = yarn
; rope-scale = 8
; yarn-orig-ctx = 32768
; -----------------------------------------------------------------

; *******************************************
; * Qwen3.6-27B AutoRound (Q4_K_M)        *
; * buun-llama-cpp fork optimizations      *
; * VBR · TCQ · mmproj-gpu-swap           *
; *******************************************
;
; buun-llama-cpp KV Cache codecs (measured on Qwen3.6-27B Q6_K, 16K, RTX 3090):
;   f16           16.0 bpv  PPL 5.683  KL 0 (ref)     pp 1104  tg 30.7
;   q8_0          8.5 bpv   PPL 5.698  KL 0.00020     pp 1050  tg 27.4
;   turbo8        8.125 bpv PPL 5.693  KL 0.00020     pp 1013  tg 28.6
;   turbo4        4.125 bpv PPL 5.723  KL 0.00090     pp 1017  tg 28.4
;   q4_0          4.5 bpv   PPL 5.705  KL 0.00115     pp 1033  tg 26.9
;   turbo3_tcq    3.25 bpv  PPL 5.668  KL 0.00163     pp 818   tg 26.6  <-- best 3-bit
;   turbo3        3.5 bpv   PPL 5.730  KL 0.00279     pp 1015  tg 28.1
;   turbo2_tcq    2.25 bpv  PPL 5.711  KL 0.00561     pp 985   tg 28.5  <-- max compression
;   turbo2        2.5 bpv   PPL 5.964  KL 0.01083     pp 1013  tg 28.2
;   turbo1_tcq    1.25 bpv  PPL 6.012  KL 0.02633     pp 991   tg 28.5
;
; VBR (Variable Bit-Rate): -ct vbr
;   Auto-derives KV VRAM budget from leftover VRAM after weights + compute.
;   Starts at f16, degrades layer-by-layer as context grows.
;   On RTX 3090: 24 - 16 - 1.25 overhead ≈ 6.75 GB for KV cache.
;
; mmproj-gpu-swap: --mmproj-gpu-swap
;   Keeps mmproj on CPU, swaps MTP out of VRAM when images arrive.
;   MTP has no persistent state, so swap is lossless.
;   ~1-2s encoding vs 30-60s on CPU.

[Qwen3.6-27B-AR-Q4KM-128K-VBR-Vision-buun]
model = /models/sphaela/Qwen3.6-27B-AutoRound-GGUF/Qwen3.6-27B-Q4_K_M.gguf
mmproj = /models/sphaela/Qwen3.6-27B-AutoRound-GGUF/mmproj-model-bf16.gguf
ctx-size = 131072
cache-type = vbr
spec-type = draft-mtp
spec-draft-n-max = 4
mmproj-gpu-swap = true
temp = 0.6
top-k = 20
min-p = 0.0

[Qwen3.6-27B-AR-Q4KM-128K-VBR-Vision-buun-tuned]
model = /models/sphaela/Qwen3.6-27B-AutoRound-GGUF/Qwen3.6-27B-Q4_K_M.gguf
mmproj = /models/sphaela/Qwen3.6-27B-AutoRound-GGUF/mmproj-model-bf16.gguf
ctx-size = 131072
cache-type = vbr
mmproj-gpu-swap = true
spec-type = draft-mtp
spec-draft-n-max = 4
temp = 0.6
top-k = 20
min-p = 0.0
; spec-draft-p-min = 0.85
; fit-target = 3584

; No -c: fit + VBR auto-size the context to whatever fits the leftover VRAM
; after weights/compute, at the --vbr-floor quality (default t1 = 1.25 bpv).
; This is the "maximum context" pick recommended by the fork's README.
;
; fit-target raised from the global 1024 MiB: --fit's VRAM budget only prices
; the KV cache + weights, it does NOT reserve room for the MTP speculative
; recurrent-state backup buffer, which is allocated lazily at request time and
; scales with ctx-size (~2.4 GiB at the ~257K ctx this preset used to fit to).
; With only 1024 MiB margin that allocation silently OOMs (non-fatal at load,
; but corrupts generation later — garbage output / grammar-stack exceptions
; once the KV cache is pushed to its floor tier). 5120 MiB headroom leaves
; enough spare VRAM for it while still landing close to max context.
; ~92K and crash
[Qwen3.6-27B-AR-Q4KM-VBR-MAXCTX-MTP3-buun]
model = /models/sphaela/Qwen3.6-27B-AutoRound-GGUF/Qwen3.6-27B-Q4_K_M.gguf
; dummy-ctx-size = 262144
fit-target = 2560
cache-type = vbr
spec-type = draft-mtp
spec-draft-n-max = 3
temp = 0.6
top-k = 20
min-p = 0.0

[Qwen3.6-27B-AR-Q4KM-VBR-MAXCTX-MTP2-buun]
model = /models/sphaela/Qwen3.6-27B-AutoRound-GGUF/Qwen3.6-27B-Q4_K_M.gguf
; dummy-ctx-size = 262144
fit-target = 2560
cache-type = vbr
spec-type = draft-mtp
spec-draft-n-max = 2
temp = 0.6
top-k = 20
min-p = 0.0

