# *******************************************
# * buun-llama-cpp fork with VBR + TCQ     *
# * + mmproj-gpu-swap optimizations        *
# *******************************************
#
# Key optimizations over upstream llama.cpp:
#   VBR  - Variable Bit-Rate KV cache (dynamic per-layer quantization)
#   TCQ  - Trellis-coded quantization (turbo3_tcq, turbo2_tcq)
#   mmproj-gpu-swap - Swaps MTP out of VRAM for vision encoding
#   Custom chat template with 25 fixes over official Qwen3.6
#
# Image: ghcr.io/spiritbuun/buun-llama-cpp:buildcache-cuda12-amd64
# Docs:  https://github.com/spiritbuun/buun-llama-cpp
# Chat:  https://huggingface.co/spiritbuun/buun-Qwen3.6-chat_template

services:
  buun-llama-cpp:
    container_name: buun-llama-cpp
    image: ghcr.io/spiritbuun/buun-llama-cpp:buildcache-cuda12-amd64
    network_mode: host
    restart: unless-stopped
    volumes:
      - ../huggingface:/models
      - ./router.ini:/app/router.ini
      - ./buun-chat-template:/app/buun-chat-template:ro
    deploy:
      resources:
        reservations:
          devices:
            - driver: nvidia
              device_ids: ['0']
              capabilities: [gpu]
    environment:
      - LLAMA_API_KEY=${LLAMA_API_KEY}
    # VBR mode: let the fork auto-derive KV budget from leftover VRAM
    # --ct vbr enables dynamic per-layer KV quantization (f16 -> turbo8 -> turbo4 -> turbo3_tcq -> turbo2_tcq -> turbo1_tcq)
    # --mmproj-gpu-swap keeps mmproj on CPU, swaps MTP out only when images arrive
    # --flash-attn is required for VBR/TCQ
    command: >
      --host 0.0.0.0
      --port 10006
      --models-preset /app/router.ini
      --models-max 1
      --no-warmup
      --flash-attn
      --context-shift
      --ctx-checkpoints 2
      --swa-checkpoints 2
      --cache-ram 10240
      --cache-reuse 4096
