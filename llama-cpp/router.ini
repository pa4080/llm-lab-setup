[*]
batch-size = 4096 ; b = 2048
ubatch-size = 1024 ; ub = 512
flash-attn = on
cache-type-k = q4_0
cache-type-v = q4_0
fit = on                          ; auto-fit to VRAM (default)
fit-target = 1024                 ; 1024 MiB headroom per GPU (default)
fit-ctx = 4096                    ; min ctx-size when fitting (default)
temp = 0.8                        ; temperature (default)
top-k = 40                        ; top-k sampling (default)
top-p = 0.95                      ; top-p nucleus (default)
min-p = 0.05                      ; min-p filtering (default)
repeat-penalty = 1.0              ; neutral (default, no penalty)
presence-penalty = 0.0            ; no presence penalty (default)
frequency-penalty = 0.0           ; no frequency penalty (default)
n-gpu-layers = 99 								; number of layers to offload to GPU
image-min-tokens = 1024					  ; min tokens for image input
; mlock = true										; default
; jinja = true										; default
; host = 0.0.0.0
; seed = 42

; --- 256K Context & YaRN RoPE Scaling for model trained on 32K ---
; ctx-size = 262144
; rope-scaling = yarn
; rope-scale = 8
; yarn-orig-ctx = 32768
; -----------------------------------------------------------------

; *******************************************
; * Qwen3.6-27B AutoRound (Q4_K_M)        *
; * Intel AutoRound · 16 GB · 64 layers   *
; * 4 KV · MTP · Text-only                *
; *******************************************
;
; Recommended Sampling (docs):
;   Thinking (general):     temp=1.0  top-p=0.95 top-k=20 pres-pen=0.0 rep-pen=1.0
;   Thinking (coding):      temp=0.6  top-p=0.95 top-k=20 pres-pen=0.0 rep-pen=1.0
;   Instruct (non-thinking): temp=0.7  top-p=0.80 top-k=20 pres-pen=1.5 rep-pen=1.0
;
; VRAM on RTX 3090 (24 GB): 24 - 16 - 1.25 overhead ≈ 6.75 GB for KV cache
;   q8_0 cache → ~83K tokens max context
;   Intel AutoRound: iterative calibration → ~41% lower perplexity vs standard Q4
;   Text-only: no vision encoder, no mmproj needed
;   MTP enabled: draft-mtp speculative decoding supported
;

