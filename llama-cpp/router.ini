; *******************************************
; * Laguna S 2.1 (Q4_K_M)                 *
; * Poolside · 118B total / 3B active      *
; * MoE · 256 experts, 8 active          *
; * Text-only · Native reasoning           *
; *******************************************
;
; Model details (from HF):
;   laguna-s-2.1-Q4_K_M.gguf: 68 GB, routed experts Q4_K, signal path Q8_0
;   laguna-s-2.1-DFlash-BF16.gguf: 2.2 GB draft model for speculative decoding
;
; VRAM considerations:
;   Model size: ~68 GB (Q4_K_M quantization)
;   With RTX 3090/4090 (24GB), use LagunaS2.1_118B-A8B-Q4KM-64K-Fit variant below
;   Recommended for A100 40GB+ or multi-GPU setups
;
; Context window:
;   Native 262,144-token (256K) context - no YaRN needed
;   Mixed SWA/global attention patterns
;
; Speculative decoding requires ik_llama.cpp:
;   Standard llama.cpp will fail with: "unknown speculative type: dflash"
;   Use Poolside's fork: git clone --branch laguna https://github.com/poolsideai/llama.cpp
;
; References:
; - https://huggingface.co/poolside/Laguna-S-2.1-GGUF
; - https://huggingface.co/unsloth/Laguna-S-2.1-GGUF/discussions/13

load-mode = none

[LagunaS2.1_118B-A8B-Q4KM-256K-f16]
model = /models/unsloth/Laguna-S-2.1-GGUF/UD-IQ4_XS/Laguna-S-2.1-UD-IQ4_XS-00001-of-00003.gguf

# --- 1. VRAM Optimization ---
n-gpu-layers = 99
; cpu-moe = true       ; Forces all expert weights to system RAM to make room for the 256K cache
n-cpu-moe = 44
; override-tensor = blk\.(1[5-9]|[2-4][0-9])\.ffn_.*_exps\.weight=CPU
# Offload only the largest MoE expert layers (blocks 15-49) to CPU

# --- 2. Context & Memory ---
fit = on
flash-attn = on
fit-ctx = 262144
ctx-size = 262144

# --- 3. Cache ---
cache-type-k = f16
cache-type-v = f16

# --- 4. Processing ---
; kv-unified = on
parallel = 1
batch-size = 2048  # Increased from 1024
ubatch-size = 512
ctx-checkpoints = 16  # Reduced from 32
swa-checkpoints = 16

# --- 5. Formatting & Sampling ---
jinja = true
chat-template-kwargs = {"enable_thinking":true, "preserve_thinking":true}
temp = 0.6
top-p = 0.95
top-k = 20
min-p = 0.0
load-mode = none

