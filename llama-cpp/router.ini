[*]
batch-size = 2048  ; b = 2048
ubatch-size = 1024 ; ub = 512 / 1024
flash-attn = on
; cache-type-k = q4_0
; cache-type-v = q4_0
;fit = on                          ; auto-fit to VRAM (default)
;fit-target = 1024                 ; MiB headroom per GPU (default: 1024)
;fit-ctx = 4096                    ; min ctx-size when fitting
;temp = 0.8                        ; temperature (default)
;top-k = 40                        ; top-k sampling (default)
;top-p = 0.95                      ; top-p nucleus (default)
;min-p = 0.05                      ; min-p filtering (default)
;repeat-penalty = 1.0              ; neutral (default, no penalty)
;presence-penalty = 0.0            ; no presence penalty (default)
;frequency-penalty = 0.0           ; no frequency penalty (default)
; n-gpu-layers = 99 							; number of layers to offload to GPU
image-min-tokens = 1024		 		  ; min tokens for image input
; mlock = true										; default
; jinja = true										; default
; host = 0.0.0.0
; seed = 42

; --- 256K Context & YaRN RoPE Scaling for model trained on 32K ---
; ctx-size = 262144
; rope-scaling = yarn
; rope-scale = 8
; yarn-orig-ctx = 32768
