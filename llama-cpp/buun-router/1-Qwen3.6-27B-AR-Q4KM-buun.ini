; *******************************************
; * Qwen3.6-27B AutoRound (Q4_K_M)        *
; * buun-llama-cpp fork optimizations      *
; * VBR · TCQ · mmproj-gpu-swap           *
; *******************************************
;
; buun-llama-cpp KV Cache codecs (measured on Qwen3.6-27B Q6_K, 16K, RTX 3090):
;   f16           16.0 bpv  PPL 5.683  KL 0 (ref)     pp 1104  tg 30.7
;   q8_0          8.5 bpv   PPL 5.698  KL 0.00020     pp 1050  tg 27.4
;   turbo8        8.125 bpv PPL 5.693  KL 0.00020     pp 1013  tg 28.6
;   turbo4        4.125 bpv PPL 5.723  KL 0.00090     pp 1017  tg 28.4
;   q4_0          4.5 bpv   PPL 5.705  KL 0.00115     pp 1033  tg 26.9
;   turbo3_tcq    3.25 bpv  PPL 5.668  KL 0.00163     pp 818   tg 26.6  <-- best 3-bit
;   turbo3        3.5 bpv   PPL 5.730  KL 0.00279     pp 1015  tg 28.1
;   turbo2_tcq    2.25 bpv  PPL 5.711  KL 0.00561     pp 985   tg 28.5  <-- max compression
;   turbo2        2.5 bpv   PPL 5.964  KL 0.01083     pp 1013  tg 28.2
;   turbo1_tcq    1.25 bpv  PPL 6.012  KL 0.02633     pp 991   tg 28.5
;
; VBR (Variable Bit-Rate): -ct vbr
;   Auto-derives KV VRAM budget from leftover VRAM after weights + compute.
;   Starts at f16, degrades layer-by-layer as context grows.
;   On RTX 3090: 24 - 16 - 1.25 overhead ≈ 6.75 GB for KV cache.
;
; mmproj-gpu-swap: --mmproj-gpu-swap
;   Keeps mmproj on CPU, swaps MTP out of VRAM when images arrive.
;   MTP has no persistent state, so swap is lossless.
;   ~1-2s encoding vs 30-60s on CPU.

[*Qwen3.6-27B-AR-Q4KM-VBR-MTP3-buun]
model = /models/sphaela/Qwen3.6-27B-AutoRound-GGUF/Qwen3.6-27B-Q4_K_M.gguf
chat-template = /app/buun-chat-template/chat_template.jinja
ctx-size = 131072
cache-type = vbr
spec-type = draft-mtp
spec-draft-n-max = 3
temp = 0.6
top-k = 20
min-p = 0.0

