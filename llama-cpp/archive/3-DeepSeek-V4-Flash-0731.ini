; Docs:
; - https://huggingface.co/unsloth/DeepSeek-V4-Flash-0731-GGUF
; - https://unsloth.ai/docs/models/deepseek-v4
; - https://unsloth.ai/docs/models/deepseek-v4#dspark-speculative-decoding
;
; Arch: deepseek4 MoE, 284B total / 13B active, 43 layers, 256 experts/layer
; (6 routed + 1 shared active). MLA attention (head_count_kv=1, q/output lora 1024),
; native 1M ctx (YaRN). Weight file ~162GB (UD-Q8_K_XL, 5 shards) => BIGGER THAN RAM
; (~94GB RAM+swap), so BOTH entries must stream experts from disk via the page cache:
;   no-repack : repacking would build a ~147GB in-RAM buffer and OOM the load
;   cpu-moe   : keep ALL MoE experts in system RAM; GPU holds only attention+dense (~6.5GB)
;   mmap      : page-fault expert pages from /mnt/data; LRU page cache keeps hot experts resident
; KV is MLA-latent (tiny) and f16; K and V cache types MUST match for this arch (llama.cpp).
; /mnt/data ~1.3 GB/s => gen ~0.2-0.5 tok/s cold, hotter once experts are page-cache resident.
; DSpark draft (10.9GB Q8_0) fits on GPU alongside the ~6.5GB attention.

[DeepSeek-V4-Flash-0731]
model = /models/unsloth/DeepSeek-V4-Flash-0731-GGUF/UD-Q8_K_XL/DeepSeek-V4-Flash-0731-UD-Q8_K_XL-00001-of-00005.gguf
; --- Bigger-than-RAM: stream 162GB of experts from disk ---
no-repack = true
cpu-moe = true
; load-mode = mmap
load-mode = mmap
n-gpu-layers = 99
; --- Context & memory ---
; fit-ctx = 262144
ctx-size = 262144
fit = on
flash-attn = on
cache-type-k = q8_0
cache-type-v = q8_0
parallel = 1
; --- Sampling (per 0731 card: temp 1.0, top-p 1.0, Think High on by default) ---
jinja = true
chat-template-kwargs = {"enable_thinking":true, "preserve_thinking":true, "reasoning_effort":"high"}
temp = 1.0
top-p = 1.0

[DeepSeek-V4-Flash-0731_DSpark]
model = /models/unsloth/DeepSeek-V4-Flash-0731-GGUF/UD-Q8_K_XL/DeepSeek-V4-Flash-0731-UD-Q8_K_XL-00001-of-00005.gguf
; --- Bigger-than-RAM: same main-model streaming as the plain entry ---
no-repack = true
cpu-moe = true
load-mode = mmap
n-gpu-layers = 99
; --- DSpark speculative decoding ---
spec-type = draft-dspark
spec-draft-model = /models/unsloth/DeepSeek-V4-Flash-0731-GGUF/dspark-DeepSeek-V4-Flash-0731-Q8_0.gguf
spec-draft-n-max = 3
spec-draft-ngl = 99
spec-draft-type-k = q4_0
spec-draft-type-v = q4_0
; --- Context & memory (smaller ctx to leave room for the 10.9GB draft) ---
ctx-size = 64000
fit = off
flash-attn = on
cache-type-k = q4_0
cache-type-v = q4_0
parallel = 1
; --- Sampling ---
jinja = true
chat-template-kwargs = {"enable_thinking":true, "preserve_thinking":true, "reasoning_effort":"high"}
temp = 1.0
top-p = 1.0
