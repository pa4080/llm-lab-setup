services:
  llama-cpp:
    container_name: llama-cpp
    image: ghcr.io/ggml-org/llama.cpp:server-cuda
    network_mode: host
    restart: unless-stopped
    volumes:
      - ../models:/models
      - ./router.ini:/app/router.ini
    deploy:
      resources:
        reservations:
          devices:
            - driver: nvidia
              device_ids: ['0']
              capabilities: [gpu]
    environment:
      - LLAMA_API_KEY=${LLAMA_API_KEY}
      # Force container to only see GPU 0 (RTX 3090). Even with Xorg/Mutter/KMS
      # isolation on the host, this prevents the container from accidentally using
      # the T600 (GPU 1) for compute if something leaks through.
      - CUDA_VISIBLE_DEVICES=0
      # - GGML_CUDA_GRAPH_OPT=1

      # --ctx-checkpoints 4
      # --swa-checkpoints 4
    command: >

