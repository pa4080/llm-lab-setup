services:
  llama-cpp:
    container_name: llama-cpp
    #  The current Driver 595.84 supports CUDA Version: 13.2, the image requires CUDA 13.3
    # image: ghcr.io/ggml-org/llama.cpp:server-cuda13
    image: ghcr.io/ggml-org/llama.cpp:server-cuda
    network_mode: host
    restart: unless-stopped
    volumes:
      - ../models:/models
      - ./router.ini:/app/router.ini
    logging:
      driver: "journald"
      # driver: "json-file"
      # options:
      #   max-size: "10m"
      #   max-file: "3"
    deploy:
      resources:
        reservations:
          devices:
            - driver: nvidia
              device_ids: ['0']
              capabilities: [gpu]
    environment:
      - LLAMA_API_KEY=${LLAMA_API_KEY}
      # Force container to only see GPU 0 (RTX 3090). Even with Xorg/Mutter/KMS
      # isolation on the host, this prevents the container from accidentally using
      # the T600 (GPU 1) for compute if something leaks through.
      - CUDA_VISIBLE_DEVICES=0
      - CLAUDE_CODE_ATTRIBUTION_HEADER=0
      # - GGML_CUDA_GRAPH_OPT=1
    command: >
      --host 0.0.0.0
      --port 10005
      --models-preset /app/router.ini
      --models-max 1
      --threads 16
      --no-warmup
      --no-context-shift
      --cache-ram 65536
      --cache-reuse 4096
