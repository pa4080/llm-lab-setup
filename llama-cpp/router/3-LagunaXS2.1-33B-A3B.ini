; *******************************************
; * Laguna XS 2.1 (Q4_K_M)                 *
; * Poolside · 33B total / 3B active       *
; * MoE · 256 experts, 1 shared            *
; * Text-only · No MTP · Native reasoning  *
; *******************************************
;
; Recommended params (HF discussion #2):
;   temp=1.0 top-p=1.0 top-k=20 min-p=0.0 batch=1024 ubatch=512 parallel=1
;   jinja=on flash-attn=on for optimal performance
;   (temp=0.6 causes looping with this MoE)
;
; VRAM on RTX 3090 (24 GB): ~20.3 GB model + q4_0 cache
;   128K context q4_0 KV → ~2 GB, total ~22.3 GB (fits)
;
; Native 262K context — no YaRN needed for 128K
; Mixed SWA/global attention: 30 SWA + 10 global layers

[LagunaXS2.1_33B-A3B-Q4KM-128K-q4]
model = /models/poolside/Laguna-XS-2.1-GGUF/Laguna-XS-2.1-Q4_K_M.gguf
n-gpu-layers = 99
fit = off
; ctx-size = 176128
ctx-size = 200704
kv-unified = on
; client-ctx-size = 128000
; Enable jinja template for chat format with reasoning support
jinja = on
; Enable flash attention for efficient large-context computation
flash-attn = on
parallel = 2
batch-size = 1024
ubatch-size = 512
cache-type-k = q4_0
cache-type-v = q4_0
temp = 1.0
top-p = 1.0
top-k = 20
; min-p = 0.0 (disabled) allows top-p=1.0 to work with min-p sampling
min-p = 0.0
ctx-checkpoints = 8
swa-checkpoints = 8
; chat-template-kwargs = {"preserve_thinking":true}

[LagunaXS2.1_33B-A3B-Q4KM-168K-q4]
model = /models/poolside/Laguna-XS-2.1-GGUF/Laguna-XS-2.1-Q4_K_M.gguf
n-gpu-layers = 99
fit = off
ctx-size = 176128
; ctx-size = 200704
kv-unified = on
; client-ctx-size = 168000
; Enable jinja template for chat format with reasoning support
jinja = on
; Enable flash attention for efficient large-context computation
flash-attn = on
parallel = 1
batch-size = 1024
ubatch-size = 512
cache-type-k = q4_0
cache-type-v = q4_0
temp = 1.0
top-p = 1.0
top-k = 20
; min-p = 0.0 (disabled) allows top-p=1.0 to work with min-p sampling
min-p = 0.0
ctx-checkpoints = 8
swa-checkpoints = 8
; chat-template-kwargs = {"preserve_thinking":true}

; *******************************************
; * Laguna XS 2.1 DFlash Speculative      *
; * Draft: ik_llama.cpp Laguna DFlash     *
; * Q8_0 draft with Q4_K_M target         *
; * n_max=2, cross_ctx=512                *
; * WARNING: Requires ik_llama.cpp build  *
; *******************************************
;
; DFlash speculative decoding for accelerated generation.
; NOTE: Requires ik_llama.cpp with DFlashLagunaForCausalLM support.
; The standard llama.cpp docker image does NOT support dflash.
; Draft runs on GPU (ngld=999) to avoid CPU bottleneck.
; Using this config with standard llama.cpp will fail with:
;   "unknown speculative type: dflash"
;

;; This require ik_llama.cpp
; [LagunaXS2.1_33B-A3B-Q4KM-128K-dflash]
; model = /models/poolside/Laguna-XS-2.1-GGUF/Laguna-XS-2.1-Q4_K_M.gguf
; model-draft = /models/ji-farthing/Laguna-XS-2.1-DFlash-ik-llama-GGUF/Laguna-XS-2.1-DFlash-ik_llama-Q8_0.gguf
; n-gpu-layers = 99
; n-gpu-layers-draft = 99
; ngld = 999
; fit = off
; ctx-size = 131072
; jinja = on
; flash-attn = on
; spec-type = draft-dflash
; spec-draft-n-max = 2
; parallel = 1
; batch-size = 1024
; ubatch-size = 512
; cache-type-k = q4_0
; cache-type-v = q4_0
; temp = 1.0
; top-p = 1.0
; top-k = 20
; ; min-p = 0.0 (disabled) allows top-p=1.0 to work with min-p sampling
; min-p = 0.0
; ctx-checkpoints = 16
; swa-checkpoints = 16
; chat-template-kwargs = {"preserve_thinking":true}
