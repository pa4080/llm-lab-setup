; *******************************************
; * Laguna S 2.1 (Q4_K_M)                 *
; * Poolside · 118B total / 3B active      *
; * MoE · 256 experts, 8 active          *
; * Text-only · Native reasoning           *
; *******************************************
;
; Model details (from HF):
;   laguna-s-2.1-Q4_K_M.gguf: 68 GB, routed experts Q4_K, signal path Q8_0
;   laguna-s-2.1-DFlash-BF16.gguf: 2.2 GB draft model for speculative decoding
;
; VRAM considerations:
;   Model size: ~68 GB (Q4_K_M quantization)
;   With RTX 3090/4090 (24GB), use LagunaS2.1_118B-A8B-Q4KM-64K-Fit variant below
;   Recommended for A100 40GB+ or multi-GPU setups
;
; Context window:
;   Native 262,144-token (256K) context - no YaRN needed
;   Mixed SWA/global attention patterns
;
; Speculative decoding requires ik_llama.cpp:
;   Standard llama.cpp will fail with: "unknown speculative type: dflash"
;   Use Poolside's fork: git clone --branch laguna https://github.com/poolsideai/llama.cpp
;
; Reference: https://huggingface.co/poolside/Laguna-S-2.1-GGUF
;   See Serving section for HF recommended commands

[LagunaS2.1_118B-A8B-Q4KM-256K-q4]
; VRAM: ~68 GB model - use 64K-Fit variant for 24GB VRAM
; For RTX 3090/4090 (24GB), use LagunaS2.1_118B-A8B-Q4KM-64K-Fit below
model = /models/poolside/Laguna-S-2.1-GGUF/laguna-s-2.1-Q4_K_M.gguf
; n-gpu-layers = 99
fit = on
fit-ctx = 262144
ctx-size = 262144
kv-unified = on
; client-ctx-size = 262144
; Enable jinja template for chat format with reasoning support
jinja = true
; Enable flash attention for efficient large-context computation
flash-attn = on
parallel = 2
batch-size = 1024
ubatch-size = 512
cache-type-k = q4_0
cache-type-v = q4_0
temp = 1.0
top-p = 1.0
top-k = 20
; min-p = 0.0 (disabled) allows top-p=1.0 to work with min-p sampling
min-p = 0.0
ctx-checkpoints = 16
swa-checkpoints = 16
chat-template-kwargs = {"preserve_thinking":true}
no-mmap = true


; *******************************************
; * Laguna S 2.1 DFlash Speculative      *
; * Draft: ik_llama.cpp Laguna DFlash     *
; * Q8_0 draft with Q4_K_M target         *
; * n_max=15, cross_ctx=512               *
; * WARNING: Requires ik_llama.cpp build  *
; * Not supported by standard llama.cpp   *
; *******************************************
;
; DFlash speculative decoding for accelerated generation.
; NOTE: Requires ik_llama.cpp with DFlashLagunaForCausalLM support.
; The standard llama.cpp docker image does NOT support dflash.
; Draft runs on GPU (ngld=999) to avoid CPU bottleneck.
; Using this config with standard llama.cpp will fail with:
;   "unknown speculative type: dflash"
;
; Reference serving command from HF:
;   ./build/bin/llama-server -m laguna-s-2.1-Q4_K_M.gguf \
;     -md laguna-s-2.1-DFlash-BF16.gguf \
;     --spec-type draft-dflash --spec-draft-n-max 15 \
;     -fa on --jinja

[LagunaS2.1_118B-A8B-Q4KM-256K-dflash]
; VRAM: ~68 GB + DFlash draft — use 64K-Fit variant for 24GB VRAM
model = /models/poolside/Laguna-S-2.1-GGUF/laguna-s-2.1-Q4_K_M.gguf
model-draft = /models/poolside/Laguna-S-2.1-GGUF/laguna-s-2.1-DFlash-BF16.gguf
spec-type = draft-dflash
spec-draft-n-max = 14
ngld = 999
; n-gpu-layers = 99
fit = on
fit-ctx = 262144
ctx-size = 262144
kv-unified = on
; client-ctx-size = 262144
; Enable jinja template for chat format with reasoning support
jinja = true
; Enable flash attention for efficient large-context computation
flash-attn = on
parallel = 2
batch-size = 1024
ubatch-size = 512
cache-type-k = q4_0
cache-type-v = q4_0
temp = 1.0
top-p = 1.0
top-k = 20
; min-p = 0.0 (disabled) allows top-p=1.0 to work with min-p sampling
min-p = 0.0
ctx-checkpoints = 16
swa-checkpoints = 16
chat-template-kwargs = {"preserve_thinking":true}
no-mmap = true
