; *******************************************
; * Qwen3.6-27B AutoRound (Q4_K_M)        *
; * Intel AutoRound · 16 GB · 64 layers   *
; *******************************************
;
; Recommended Sampling (docs):
;   Thinking (general):     temp=1.0  top-p=0.95 top-k=20 pres-pen=0.0 rep-pen=1.0
;   Thinking (coding):      temp=0.6  top-p=0.95 top-k=20 pres-pen=0.0 rep-pen=1.0
;   Instruct (non-thinking): temp=0.7  top-p=0.80 top-k=20 pres-pen=1.5 rep-pen=1.0
;
; VRAM on RTX 3090 (24 GB): 24 - 16 - 1.25 overhead ≈ 6.75 GB for KV cache
;   q8_0 cache → ~83K tokens max context
;   Intel AutoRound: iterative calibration → ~41% lower perplexity vs standard Q4
;   Text-only: no vision encoder, no mmproj needed
;   MTP enabled: draft-mtp speculative decoding supported
;
; Docs:
; - https://huggingface.co/unsloth/Qwen3.6-27B-MTP-GGUF
; - https://huggingface.co/Qwen/Qwen3.6-27B
; - https://qwen.ai/blog?id=qwen3.6-27b


[Qwen3.6-27B-AR-Q4KM-136K_MTP_Vision_q8]
model = /models/sphaela/Qwen3.6-27B-AutoRound-GGUF/Qwen3.6-27B-Q4_K_M.gguf
n-gpu-layers = 99
fit = off
ctx-size = 139264
; client-ctx-size = 139264

kv-unified = on
cache-idle-slots = true
parallel = 1
cache-type-k = q8_0
cache-type-v = q8_0

spec-type = draft-mtp
spec-draft-n-max = 4
spec-draft-p-min = 0.85
cache-type-k-draft = q8_0
cache-type-v-draft = q8_0

ctx-checkpoints = 64
swa-checkpoints = 64

temp = 0.6
top-p = 0.95
top-k = 20
min-p = 0.0
presence-penalty = 0.0
repeat-penalty = 1.05     ; Prevents the model from looping and immediately spitting out an EOS token
reasoning-preserve = true
chat-template-kwargs = {"preserve_thinking":true}

mmproj = /models/sphaela/Qwen3.6-27B-AutoRound-GGUF/mmproj-model-bf16.gguf
no-mmproj-offload = true


