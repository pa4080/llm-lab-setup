; *******************************************
; * Qwen3.6-35B-A3B-MTP                     *
; * Recommended Sampling Parameters (docs)  *
; *******************************************
;
; Thinking mode (general):        temp=1.0  top-p=0.95 top-k=20 min-p = 0.0  pres-pen=1.5 rep-pen=1.0
; Instruct mode (general):        temp=0.7  top-p=0.80 top-k=20 min-p = 0.0  pres-pen=1.5 rep-pen=1.0
; Instruct mode (reasoning):      temp=1.0  top-p=1.00 top-k=40 min-p = 0.0  pres-pen=2.0 rep-pen=1.0
; Thinking mode (coding):         temp=0.6  top-p=0.95 top-k=20 min-p = 0.0  pres-pen=0.0 rep-pen=1.0
;
; Current defaults (0-Defaults.ini): flash-attn=on cache=k/v=q4_0  fit=on  fit-target=1024
;																	temp=0.8  top-p=0.95 top-k=40 min-p = 0.05 pres-pen=0.0 rep-pen=1.0
;
; Model overrides:  temp=0.6  top-k=20  (coding mode settings)
; Note: 256K / 160K context configs are dead weight on single RTX 3090 (24 GB).
;        ~18.5 GB model + q8_0 cache → ~55K tokens max KV cache.
; *******************************************
;
; Docs:
; - https://huggingface.co/unsloth/Qwen3.6-35B-A3B-MTP-GGUF

[Qwen3.6-35B-A3B-IQ4NL-196K_MTP_Vision_q8]
model = /models/unsloth/Qwen3.6-35B-A3B-MTP-GGUF/Qwen3.6-35B-A3B-UD-IQ4_NL.gguf
n-gpu-layers = 99
fit = off
ctx-size = 200704
; client-ctx-size = 200704

kv-unified = on
cache-idle-slots = true
parallel = 3
cache-type-k = q8_0
cache-type-v = q8_0

spec-type = draft-mtp
spec-draft-n-max = 5
spec-draft-p-min = 0.85
cache-type-k-draft = q8_0
cache-type-v-draft = q8_0

ctx-checkpoints = 128

temp = 0.6
top-p = 0.95
top-k = 20
min-p = 0.0
presence-penalty = 0.0
repeat-penalty= 1.0

mmproj = /models/unsloth/Qwen3.6-35B-A3B-MTP-GGUF/mmproj-BF16.gguf
no-mmproj-offload = true

chat-template-kwargs = {"enable_thinking":true, "preserve_thinking":true, "reasoning_effort":"high"}

[Qwen3.6-35B-A3B-IQ4NL-256K_MTP_Vision_q4]
model = /models/unsloth/Qwen3.6-35B-A3B-MTP-GGUF/Qwen3.6-35B-A3B-UD-IQ4_NL.gguf
