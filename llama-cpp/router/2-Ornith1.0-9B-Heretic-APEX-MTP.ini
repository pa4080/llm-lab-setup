; *******************************************
; * Ornith-1.0-9B MTP                       *
; *******************************************

[Ornith1.0-9B-HAIC-256K_MTP_Vision_q8]
model = /models/SC117/Ornith-1.0-9B-heretic-MTP-GGUF/Ornith-1.0-9B-heretic-MTP-Q8_0.gguf
n-gpu-layers = 99
fit = off
ctx-size = 262144
; client-ctx-size = 262144
cache-type-k = q8_0
cache-type-v = q8_0
cache-type-k-draft = q8_0
cache-type-v-draft = q8_0
spec-type = draft-mtp
spec-draft-n-max = 4
spec-draft-p-min = 0.85
temp = 0.6
top-k = 20
ctx-checkpoints = 128

mmproj = /models/SC117/Ornith-1.0-9B-heretic-MTP-GGUF/mmproj-Ornith-1.0-9B-heretic-MTP-BF16.gguf
no-mmproj-offload = true
; Reasoning effort tiers (low/medium/high/xhigh) are a Copilot abstraction —
; Ornith itself is binary: always thinks, never instructed. Keep "high" as a
; default for Copilot UI, but the model doesn't differentiate between tiers.
chat-template-kwargs = {"enable_thinking":true, "preserve_thinking":true, "reasoning_effort":"high"}

[Ornith1.0-9B-HAIC-512K-MTP_Vision_q4]
model = /models/SC117/Ornith-1.0-9B-heretic-MTP-GGUF/Ornith-1.0-9B-heretic-MTP-Q8_0.gguf
n-gpu-layers = 99
fit = off
yarn-orig-ctx = 262144
rope-scaling = yarn
rope-scale = 2
ctx-size = 524288
; client-ctx-size = 524288
cache-type-k = q4_0
cache-type-v = q4_0
cache-type-k-draft = q4_0
cache-type-v-draft = q4_0
spec-type = draft-mtp
spec-draft-n-max = 4
spec-draft-p-min = 0.85
temp = 0.6
top-k = 20
ctx-checkpoints = 128

mmproj = /models/SC117/Ornith-1.0-9B-heretic-MTP-GGUF/mmproj-Ornith-1.0-9B-heretic-MTP-BF16.gguf
no-mmproj-offload = true

; Reasoning effort tiers (low/medium/high/xhigh) are a Copilot abstraction —
; Ornith itself is binary: always thinks, never instructed. Keep "high" as a
; default for Copilot UI, but the model doesn't differentiate between tiers.
chat-template-kwargs = {"enable_thinking":true, "preserve_thinking":true, "reasoning_effort":"high"}
