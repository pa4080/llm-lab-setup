; *******************************************
; * Ornith-1.0-35B-Heretic-MTP-APEX         *
; *******************************************
; Heretic Trial 63 of 120 · LoRA 1.4.0 merged into BF16
; Qwen3.5 MoE: 35B total / 3B active, 256 experts, 8 active
; 40 transformer layers + 1 MTP layer (785 BF16 tensors)
; APEX mixed-precision GGUF (I-Compact, ~16.14 GB) + BF16 mmproj
; Compatible Qwen3.5 MTP head · 262K context

[Ornith1.0-35B-HAIC-196K_MTP_Vision_q8]
model = /models/SC117/Ornith-1.0-35B-Heretic-MTP-APEX-GGUF/Ornith-1.0-35B-Heretic-MTP-APEX-I-Compact.gguf
n-gpu-layers = 99
fit = off
ctx-size = 256000
; client-ctx-size = 200704
kv-unified = on
parallel = 2
cache-type-k = q8_0
cache-type-v = q8_0
cache-type-k-draft = q8_0
cache-type-v-draft = q8_0
spec-type = draft-mtp
spec-draft-n-max = 5
spec-draft-p-min = 0.85
temp = 0.6
top-k = 20
min-p = 0.0
ctx-checkpoints = 128

mmproj = /models/SC117/Ornith-1.0-35B-Heretic-MTP-APEX-GGUF/mmproj-Ornith-1.0-35B-Heretic-MTP-BF16.gguf
no-mmproj-offload = true

; Reasoning effort tiers (low/medium/high/xhigh) are a Copilot abstraction —
; Ornith itself is binary: always thinks, never instructed. Keep "high" as a
; default for Copilot UI, but the model doesn't differentiate between tiers.
chat-template-kwargs = {"enable_thinking":true, "preserve_thinking":true, "reasoning_effort":"high"}
